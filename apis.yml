description: >-
  The Scotts Miracle-Gro Company is the world's largest marketer of branded consumer lawn
  and garden products, with brands including Scotts, Miracle-Gro, Ortho, Roundup and Tomcat.
  It is a physical consumer-goods manufacturer and retailer: its digital surface is a
  Salesforce Commerce Cloud storefront and corporate site at scottsmiraclegro.com, plus
  end-user mobile apps. It publishes no developer program, no public API, and no
  machine-readable contract. The one developer-facing surface it ever marketed — the open
  API for the GRO connected smart-watering platform (Gro 7 Zone Controller, Gro Water
  Sensors) — had its cloud service discontinued on 2021-12-30 and its hosts no longer
  resolve. The Hawthorne Gardening Company subsidiary was divested to Vireo Growth in
  April 2026 and is no longer part of this company's surface.
